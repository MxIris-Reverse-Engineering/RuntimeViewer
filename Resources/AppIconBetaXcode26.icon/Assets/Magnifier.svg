<?xml version="1.0" encoding="UTF-8"?>
<!-- Magnifying glass sitting on the disc. Measured off the original bitmap: ring centre
     (385.8, 385.8), outer radius 91.8 and ring width 16 (centreline r=83.8); the handle runs
     at 45 degrees from the ring's edge to (521, 523) with a round cap.

     Filled paths rather than strokes, for the reason DiscOutline.svg gives. The handle is the
     stroke's outline: a 16-wide capsule whose end caps are centred on (445, 445) and (521, 523),
     so it extends 8 past each endpoint exactly as `stroke-linecap="round"` did. -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 824">
 <g fill="#FCFCFC" fill-rule="evenodd">
  <path d="M294,385.8 A91.8,91.8 0 1,0 477.6,385.8 A91.8,91.8 0 1,0 294,385.8 Z M310,385.8 A75.8,75.8 0 1,0 461.6,385.8 A75.8,75.8 0 1,0 310,385.8 Z"/>
  <path d="M439.270,450.583 L515.270,528.583 A8,8 0 0,0 526.730,517.417 L450.730,439.417 A8,8 0 0,0 439.270,450.583 Z"/>
 </g>
</svg>
