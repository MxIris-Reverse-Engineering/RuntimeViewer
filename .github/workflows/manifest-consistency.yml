name: Manifest Consistency

on:
  pull_request:
  push:
    branches: [main, next]
  workflow_dispatch:

jobs:
  validate:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.4'

      - name: Install pinned tools
        uses: jdx/mise-action@v2

      - name: Validate SwiftPM and Tuist manifests
        run: python3 Tuist/Scripts/ValidateTuistManifests.py
