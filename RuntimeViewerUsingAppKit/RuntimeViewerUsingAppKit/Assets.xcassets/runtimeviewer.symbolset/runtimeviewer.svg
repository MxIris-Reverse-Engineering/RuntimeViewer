 <!--RuntimeViewer's own symbol: the app icon's lens ring with the magnifier in it. The ring follows the
      system `circle` and the magnifier `magnifyingglass.circle` (sizes and stroke widths measured at
      100 points, small scale, on macOS 27.2); the magnifier's place in the ring is the app icon's
      (Resources/AppIcon.icon: lens radius 0.41 of the ring, centre 0.115 of it up and left, handle at
      45 degrees). Each master is one path with the same commands in the same order, so that actool can
      interpolate the weights between them: the ring (outer, then its hole the other way round), the
      magnifier as one outline (lens and handle merged, so no fill rule is needed), then the lens's hole.
      The template's layout is the one Private Symbols writes (its fixture.frame).-->
