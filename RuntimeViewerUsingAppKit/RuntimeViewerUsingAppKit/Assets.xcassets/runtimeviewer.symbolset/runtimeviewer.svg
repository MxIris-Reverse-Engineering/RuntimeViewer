<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 3300 2200">
 <!--RuntimeViewer's own symbol, after Xcode 27's project icon (`doc-project`, which the window title
      shows as a frame with a hammer in it): the same frame with the app icon's magnifier in place of
      the hammer.
      - The frame is doc-project's two outer contours, unchanged, from the Xcode 27 template exported
        into XCOrganizer (XCOrganizerUICore/Resources/XcodeSymbols.xcassets/doc-project.symbolset).
        doc-project's filled inner plate and hammer are left out: the title draws its frame hollow.
      - The magnifier keeps the app icon's proportions (Resources/AppIcon.icon: handle at 45 degrees,
        its tip 2.19 lens radii from the lens centre), centred in the frame. Lens radius and stroke:
        20.5 and 2.25 ultralight, 20 and 6.6 regular, 19.5 and 9.5 black.
      - The margins are symmetric, unlike doc-project's, so that the title centres the frame.
      Each master is one path with the same commands in the same order, so that actool can
      interpolate the weights: the frame's outer and inner contours (opposite directions), the
      magnifier as one outline (lens and handle merged, so no fill rule is needed), the lens's hole.
      The template's layout is the one Private Symbols writes (its fixture.frame).-->
